name: E2E

# Railway waits for CI before it deploys, so e2e cannot be part of CI.
# Railway's GitHub integration posts deployment statuses; this runs the
# Playwright suite against each successful PR environment and production deploy.
on:
  deployment_status:
  workflow_dispatch:
    inputs:
      base_url:
        description: Public URL to test, e.g. https://www.ariaamini.dev
        required: true
        type: string

concurrency:
  group: e2e-${{ github.event.deployment.environment || inputs.base_url }}
  cancel-in-progress: true

jobs:
  e2e:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.deployment_status.state == 'success' &&
      (github.event.deployment.environment == 'portfolio / production' ||
      contains(github.event.deployment.environment, 'pr-')))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      DEPLOYMENT_ENVIRONMENT: ${{ github.event.deployment.environment }}
      MANUAL_BASE_URL: ${{ inputs.base_url }}
    steps:
      # Railway reports dashboard URLs in deployment_status, not the site URL.
      # PR environments are named "<service> / <environment>" and serve
      # https://<service>-<environment>.up.railway.app.
      - name: Resolve deployment URL
        run: |
          if [ -n "$MANUAL_BASE_URL" ]; then
            url="$MANUAL_BASE_URL"
          elif [ "$DEPLOYMENT_ENVIRONMENT" = "portfolio / production" ]; then
            url="https://www.ariaamini.dev"
            echo "CHECK_DOMAINS=1" >> "$GITHUB_ENV"
          else
            service="${DEPLOYMENT_ENVIRONMENT%%/*}"
            environment="${DEPLOYMENT_ENVIRONMENT##*/}"
            service="${service//[[:space:]]/}"
            environment="${environment//[[:space:]]/}"
            url="https://${service}-${environment}.up.railway.app"
          fi
          echo "CANDIDATE_URL=${url%/}" >> "$GITHUB_ENV"
          echo "Will test ${url%/}"
      - name: checkout
        uses: actions/checkout@v6
        with:
          # Manual dispatch: empty ref checks out the branch picked in the UI.
          ref: ${{ github.event.deployment.sha }}
      - name: setup vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          version: '1.1.0'
          node-version-file: .node-version
          cache: true
      - name: Install Playwright Browsers
        run: vp exec playwright install chromium webkit --with-deps --no-shell
      # Railway can report success before the new release takes traffic.
      - name: Wait for deployment to be reachable
        run: |
          url="$CANDIDATE_URL"
          for attempt in $(seq 1 30); do
            status=$(curl -sL -o /dev/null -w '%{http_code}' --max-time 20 "$url" || true)
            if [ "$status" = "200" ]; then
              echo "BASE_URL=$url" >> "$GITHUB_ENV"
              echo "Deployment is up at $url (attempt $attempt)"
              exit 0
            fi
            echo "attempt $attempt: $url returned HTTP $status"
            sleep 10
          done
          echo "Deployment never became reachable at $url" >&2
          exit 1
      - name: Run Playwright tests
        run: vp exec playwright test --ignore-snapshots
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            .playwright/report/
            .playwright/test-results/
          include-hidden-files: true
          retention-days: 14
