name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITHUB_STEP_SUMMARY: /tmp/vitest-check-summary.md
    steps:
      - name: checkout
        uses: actions/checkout@v6
      - name: setup vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: .node-version
          cache: true
      - run: vp check
      - run: vp test run --project unit

  test-visual:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: checkout
        uses: actions/checkout@v6
      - name: setup vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: .node-version
          cache: true
      - name: Install Playwright Browsers
        run: vp exec playwright install chromium --with-deps --no-shell
      - name: Run Tests
        run: vp test run --project browser
      - name: Upload visual test diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-test-diagnostics
          path: .vitest-attachments/
          include-hidden-files: true

  test-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: checkout
        uses: actions/checkout@v6
      - name: setup vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: .node-version
          cache: true
      - name: Install Chromium
        run: vp exec playwright install chromium --with-deps --no-shell
      - name: Run production smoke tests
        run: vp run e2e
      - name: Upload smoke test diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-diagnostics
          path: .playwright/
          include-hidden-files: true
