name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITHUB_STEP_SUMMARY: /tmp/vitest-check-summary.md
    steps:
      - name: checkout
        uses: actions/checkout@v6
      - name: setup vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: .node-version
          cache: true
      - run: vp check
      - run: vp test run --project unit

  resume:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: checkout
        uses: actions/checkout@v6
      - name: setup vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: .node-version
          cache: true
      # Fails on Typst errors, unknown fonts, or a second page.
      - run: vp run resume .output/resume
      - name: Upload resume PDF
        uses: actions/upload-artifact@v4
        with:
          name: resume-pdf
          path: .output/resume/aria-amini-resume.pdf
          include-hidden-files: true

  test-visual:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: checkout
        uses: actions/checkout@v6
      - name: setup vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: .node-version
          cache: true
      - name: Install Playwright Browsers
        run: vp exec playwright install chromium --with-deps --no-shell
      - name: Run Tests
        run: vp test run --project browser
      - name: Upload visual test diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-test-diagnostics
          path: .vitest-attachments/
          include-hidden-files: true
